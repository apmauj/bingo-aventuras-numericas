<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Pipo el Panda</title>

  <rect width="64" height="64" rx="16" fill="#FBBF24"/>

  <!-- Panda ears -->
  <circle cx="17" cy="17" r="11" fill="#1F2937"/>
  <circle cx="47" cy="17" r="11" fill="#1F2937"/>

  <!-- Panda face -->
  <circle cx="32" cy="35" r="23" fill="#F9FAFB" stroke="#1F2937" stroke-width="2"/>

  <!-- Eye patches and eyes -->
  <ellipse cx="23" cy="31" rx="7" ry="10" transform="rotate(-25 23 31)" fill="#1F2937"/>
  <ellipse cx="41" cy="31" rx="7" ry="10" transform="rotate(25 41 31)" fill="#1F2937"/>
  <circle cx="24" cy="31" r="3.5" fill="#F9FAFB"/>
  <circle cx="40" cy="31" r="3.5" fill="#F9FAFB"/>
  <circle cx="24" cy="31" r="1.7" fill="#111827"/>
  <circle cx="40" cy="31" r="1.7" fill="#111827"/>

  <!-- Nose and smile -->
  <ellipse cx="32" cy="41" rx="5" ry="3.5" fill="#1F2937"/>
  <path d="M32 43.5v2.5M27 46c2.5 3 7.5 3 10 0" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <circle cx="17" cy="43" r="3" fill="#FB7185" opacity=".55"/>
  <circle cx="47" cy="43" r="3" fill="#FB7185" opacity=".55"/>
</svg>
